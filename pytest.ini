[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --cov=app
    --cov=analytics_db
    --cov=syllabus_checker
    --cov=_checker_types
    --cov=checks
    --cov=llm
    --cov=output
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=60
